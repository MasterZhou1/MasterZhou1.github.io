<svg xmlns="http://www.w3.org/2000/svg" viewBox="47.8 21.0 766.2 410.4" role="img" aria-labelledby="qt qd">
  <title id="qt">One sample versus the best of many</title>
  <desc id="qd">A distribution over output quality. A single sample lands near the mode. The best of N samples lands far into the upper tail. The distance between them is what extra inference compute buys.</desc>
