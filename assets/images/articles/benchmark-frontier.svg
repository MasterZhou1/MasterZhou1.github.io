<svg xmlns="http://www.w3.org/2000/svg" viewBox="63 16 742 407" role="img" aria-labelledby="t d">
  <title id="t">Where the premium sits relative to a stabilizing benchmark</title>
  <desc id="d">The human premium is high while a domain is still being defined and collapses once its benchmark stabilizes, without falling to zero. Every domain drifts rightward over time.</desc>
