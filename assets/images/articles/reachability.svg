<svg xmlns="http://www.w3.org/2000/svg" viewBox="60.6 10.9 731.4 388.5" role="img" aria-labelledby="rt rd">
  <title id="rt">The reachability frontier</title>
  <desc id="rd">Tasks spread over single-sample success probability. With one hundred samples the frontier sits at p equal to ten to the minus two and everything easier is solved. Ten times the compute moves the frontier exactly one decade, to ten to the minus three.</desc>
