<svg xmlns="http://www.w3.org/2000/svg" viewBox="80.0 -0.0 676.0 461.8" role="img" aria-labelledby="dt dd">
  <title id="dt">How the difficulty distribution sets the shape of the scaling curve</title>
  <desc id="dd">Top row: a benchmark holding about as many tasks in every decade of success probability produces a logarithmic curve, a steady accuracy gain per decade of compute. Bottom row: a benchmark whose hard tasks thin out produces a power law, fast early gains that flatten.</desc>
