<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 32 908 456" role="img" aria-labelledby="t d">
  <title id="t">Each theory is valid over its own range of scale</title>
  <desc id="d">Seven local theories drawn as horizontal bands spanning the range of scale over which each has bite. The bands overlap at their edges, learning theory fades out at frontier scale, and no band spans the whole axis.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22333f"/></marker>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0"><stop offset="0.45" stop-color="#f4a261" stop-opacity="1"/><stop offset="1" stop-color="#f4a261" stop-opacity="0"/></linearGradient>
  </defs>
  <style>.lb{fill:#22333f;font-family:Lato,sans-serif;font-size:19px}.ax{fill:#5d6f7a;font-family:Lato,sans-serif;font-size:19px}.nt{fill:#8b99a2;font-family:Lato,sans-serif;font-size:17px;font-style:italic}</style>
  <path fill="none" stroke="#e4e9eb" stroke-width="1.4" stroke-dasharray="5 5" d="M238.0,48 L238.0,396"/>
  <path fill="none" stroke="#e4e9eb" stroke-width="1.4" stroke-dasharray="5 5" d="M454.0,48 L454.0,396"/>
  <path fill="none" stroke="#e4e9eb" stroke-width="1.4" stroke-dasharray="5 5" d="M670.0,48 L670.0,396"/>
  <path fill="none" stroke="#e4e9eb" stroke-width="1.4" stroke-dasharray="5 5" d="M886.0,48 L886.0,396"/>
  <rect x="238.0" y="66" width="259.2" height="28" rx="14.0" fill="#e76f51" fill-opacity="0.3" stroke="#e76f51" stroke-width="1.6" stroke-opacity="0.75"/>
  <text class="lb" x="214" y="87.0" text-anchor="end">optimization</text>
  <rect x="289.8" y="114" width="246.2" height="28" rx="14.0" fill="url(#fade)" fill-opacity="0.42"/>
  <text class="nt" x="550.1" y="134.0" text-anchor="start">loses bite at frontier scale</text>
  <text class="lb" x="214" y="135.0" text-anchor="end">learning theory</text>
  <rect x="302.8" y="162" width="220.3" height="28" rx="14.0" fill="#8ab17d" fill-opacity="0.3" stroke="#8ab17d" stroke-width="1.6" stroke-opacity="0.75"/>
  <text class="lb" x="214" y="183.0" text-anchor="end">representation theory</text>
  <rect x="315.8" y="210" width="246.2" height="28" rx="14.0" fill="#457b9d" fill-opacity="0.3" stroke="#457b9d" stroke-width="1.6" stroke-opacity="0.75"/>
  <text class="lb" x="214" y="231.0" text-anchor="end">interpretability</text>
  <rect x="302.8" y="258" width="440.6" height="28" rx="14.0" fill="#e9c46a" fill-opacity="0.3" stroke="#e9c46a" stroke-width="1.6" stroke-opacity="0.75"/>
  <text class="lb" x="214" y="279.0" text-anchor="end">systems &amp; efficiency</text>
  <rect x="406.5" y="306" width="298.1" height="28" rx="14.0" fill="#2a9d8f" fill-opacity="0.3" stroke="#2a9d8f" stroke-width="1.6" stroke-opacity="0.75"/>
  <text class="lb" x="214" y="327.0" text-anchor="end">empirical science</text>
  <rect x="497.2" y="354" width="388.8" height="28" rx="14.0" fill="#b07ba0" fill-opacity="0.3" stroke="#b07ba0" stroke-width="1.6" stroke-opacity="0.75"/>
  <text class="lb" x="214" y="375.0" text-anchor="end">agents</text>
  <path fill="none" stroke="#22333f" stroke-width="1.8" marker-end="url(#ah)" d="M224,400 L910,400"/>
  <text class="ax" x="238.0" y="432" text-anchor="start">one update</text>
  <text class="ax" x="454.0" y="432" text-anchor="middle">a trained model</text>
  <text class="ax" x="670.0" y="432" text-anchor="middle">a deployment</text>
  <text class="ax" x="886.0" y="432" text-anchor="end">a tool economy</text>
  <text class="ax" x="910" y="468" text-anchor="end">scale of the system being explained</text>
</svg>
